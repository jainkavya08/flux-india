name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build

      - name: Create production PHP config
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          DB_PASSWORD_B64=$(printf '%s' "$DB_PASSWORD" | base64 -w 0)

          cat > api/config.php <<PHP
          <?php

          if (!defined('FLUX_APP')) {
              define('FLUX_APP', true);
          }

          define('DB_HOST', 'localhost');
          define('DB_NAME', 'u797413374_flux');
          define('DB_USER', 'u797413374_flux');
          define('DB_PASS', base64_decode('$DB_PASSWORD_B64'));
          define('DB_PORT', '3306');

          define('APP_ENV', 'production');

          define('ADMIN_EMAIL', 'sales@fluxindia.in');

          // TODO: Update this when Hostinger/domain email is configured.
          define('FROM_EMAIL', 'noreply@fluxindia.rf.gd');

          define('UPLOAD_DIR', dirname(__DIR__) . '/uploads/bom/');

          define('MAX_FILE_SIZE', 10 * 1024 * 1024);

          define('ALLOWED_ORIGINS', [
              'https://fluxindia.co.in',
              'https://www.fluxindia.co.in',
              'http://localhost:3000',
              'http://127.0.0.1:3000',
              'http://localhost:8000',
          ]);
          PHP

      - name: Deploy Next.js website to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./out/
          server-dir: public_html/
          state-name: .flux-hostinger-sync-state.json
          timeout: 60000

      - name: Deploy PHP API to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./api/
          server-dir: public_html/api/
          state-name: .flux-api-sync-state.json
          timeout: 60000